# .github/workflows/docs.yml
name: Deploy Docs

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main, develop]
  workflow_dispatch:  # Allow manual triggering

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Fetch all history

      # Plain `docker build` on the runner's default builder keeps images in
      # the local store, so the MkDocs image can build FROM ethicrawl-base.
      # (A docker-container buildx builder would not load them.)
      - name: Build base image
        run: docker build -t ethicrawl-base -f docker/Dockerfile.base .

      - name: Build MkDocs image
        run: docker build -t ethicrawl:mkdocs -f docker/Dockerfile.mkdocs .

      - name: Build documentation
        run: |
          mkdir -p site
          docker run --rm \
            -v $(pwd)/docs:/app/docs \
            -v $(pwd)/ethicrawl:/app/ethicrawl \
            -v $(pwd)/site:/app/site \
            -v $(pwd)/mkdocs.yml:/app/mkdocs.yml \
            -v $(pwd)/README.md:/app/README.md \
            ethicrawl:mkdocs build

      # PRs only verify the docs build; deployment happens from main.
      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
