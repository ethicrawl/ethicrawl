name: security
permissions:
  contents: read

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 0 * * 0" # Weekly on Sundays
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Only the project and its lint tooling go into this environment, so
      # pip-audit reports on what ethicrawl actually depends on. Standalone
      # scanners (bandit, semgrep) run isolated via pipx.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[lint]" pip-audit

      # CODE QUALITY CHECKS
      - name: Run Black formatter check
        run: black --check .
        id: black

      # STATIC ANALYSIS (both tools target the oldest supported Python via pyproject.toml)
      - name: Run mypy type checking
        run: mypy ethicrawl
        id: mypy

      - name: Run pyright analysis
        run: pyright ethicrawl
        id: pyright

      # SECURITY CHECKS
      - name: Run Bandit
        run: pipx run bandit -r ethicrawl -f json -o bandit-results.json
        id: bandit

      - name: Run pip-audit
        run: pip-audit --skip-editable -f json -o pip-audit-results.json
        id: pip-audit

      - name: Run Semgrep
        run: pipx run semgrep scan --config=auto --json -o semgrep-results.json
        id: semgrep

      # Upload all results as artifacts
      - name: Upload scan results
        if: always() # always upload even on failure
        uses: actions/upload-artifact@v7
        with:
          name: security-and-lint-results
          if-no-files-found: ignore
          path: |
            bandit-results.json
            pip-audit-results.json
            semgrep-results.json

      # Create summary report
      - name: Create job summary
        if: always()
        run: |
          echo "## Security and Linting Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Linting Checks" >> $GITHUB_STEP_SUMMARY
          echo "- Black: ${{ steps.black.outcome == 'success' && '✅ Passed' || '❌ Failed' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Mypy: ${{ steps.mypy.outcome == 'success' && '✅ Passed' || '❌ Failed' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Pyright: ${{ steps.pyright.outcome == 'success' && '✅ Passed' || '❌ Failed' }}" >> $GITHUB_STEP_SUMMARY

          echo "### Security Checks" >> $GITHUB_STEP_SUMMARY
          echo "- Bandit: ${{ steps.bandit.outcome == 'success' && '✅ Passed' || '❌ Issues found' }}" >> $GITHUB_STEP_SUMMARY
          echo "- pip-audit: ${{ steps.pip-audit.outcome == 'success' && '✅ No vulnerabilities' || '⚠️ Vulnerabilities detected' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Semgrep: ${{ steps.semgrep.outcome == 'success' && '✅ Passed' || '❌ Issues found' }}" >> $GITHUB_STEP_SUMMARY
