[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ethicrawl"
version = "1.0.0b2"
description = "A Python library for ethical web crawling"
readme = "README.md"
authors = [
    {name = "Ethicrawl Team", email = "ethicrawl@smkd.net"},
]
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["web crawler", "ethical", "robots.txt", "sitemap", "web scraping"]
dependencies = [
    "requests>=2.32.4",
    "lxml>=5.3.0",
    "protego>=0.4.0",
    "colorama>=0.4.6",
    "selenium>=4.29.0",
]
requires-python = ">=3.10"

[project.optional-dependencies]
test = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "coverage[toml]>=7.6",
    "flask>=3.1",
]
lint = [
    # black's stable style changes each January; bump this pin deliberately.
    "black>=26.1,<27",
    "mypy>=1.15",
    "pyright>=1.1.398",
    "lxml-stubs>=0.5.1",
    "types-requests>=2.32",
    "types-colorama>=0.4.15",
]
dev = ["ethicrawl[test,lint]"]

[project.urls]
"Homepage" = "https://github.com/ethicrawl/ethicrawl"
"Documentation" = "https://ethicrawl.github.io/ethicrawl/"
"Repository" = "https://github.com/ethicrawl/ethicrawl"


[tool.setuptools.packages.find]
include = ["ethicrawl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["ethicrawl"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

# Type-check against the oldest supported Python, whatever interpreter runs the tools.
[tool.mypy]
python_version = "3.10"

[tool.pyright]
pythonVersion = "3.10"
include = ["ethicrawl"]
